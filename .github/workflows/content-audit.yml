name: Content Audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit-content.mjs'
      - 'js/default-content/**'
      - '.github/workflows/content-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Audit canonical content
        run: node scripts/audit-content.mjs
