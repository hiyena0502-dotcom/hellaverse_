  <style>
    /* Consecutive lines from the same room character should read as one natural speech block. */
    .dialogue-page-text .dialogue-line.character + .dialogue-line.character strong,
    .dialogue-lines .dialogue-line.character + .dialogue-line.character strong,
    .dialogue-log-scroll .dialogue-line.character + .dialogue-line.character strong {
      display: none;
    }
    .dialogue-page-text .dialogue-line.character + .dialogue-line.character,
    .dialogue-lines .dialogue-line.character + .dialogue-line.character,
    .dialogue-log-scroll .dialogue-line.character + .dialogue-line.character {
      margin-top: -8px;
    }
  </style>
