<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#09090B">
  <title>HELLAVERSE — Private Character Archive</title>

  <!--
    ROYAL ARCHIVE REDESIGN
    Keep gameplay on one core renderer. Old dialogue/content runtimes are intentionally
    not loaded here; they remain preserved on the archive branch.
  -->
  <link rel="stylesheet" href="css/app.css?v=80">
  <link rel="stylesheet" href="css/dialogue.css?v=80">

  <script>
  (() => {
    'use strict';
    const K = 'hellaverse_dialogue_state_v1';
    const UI = 'hellaverse_ui_v5';
    const MIGRATION = 'royalArchiveRedesignV1';
    try {
      const raw = localStorage.getItem(K);
      if (!raw) return;
      const state = JSON.parse(raw) || {};
      state.migrations = state.migrations && typeof state.migrations === 'object' ? state.migrations : {};
      if (state.migrations[MIGRATION]) return;

      // Move authored character lines out of the live game without deleting them.
      // The same pre-redesign state is also preserved in the Git archive branch.
      state.archivedContent = state.archivedContent && typeof state.archivedContent === 'object' ? state.archivedContent : {};
      state.archivedContent[MIGRATION] = {
        archivedAt: new Date().toISOString(),
        reason: 'Fresh Royal Archive redesign; old authored character dialogue hidden until explicitly restored.',
        dialogues: Array.isArray(state.dialogues) ? state.dialogues : [],
        gifts: Array.isArray(state.gifts) ? state.gifts : [],
        thoughts: Array.isArray(state.thoughts) ? state.thoughts : [],
        characterSampleLines: (Array.isArray(state.characters) ? state.characters : [])
          .filter(c => Array.isArray(c?.sampleLines) && c.sampleLines.length)
          .map(c => ({ characterId: c.id, sampleLines: c.sampleLines }))
      };

      state.dialogues = [];
      state.gifts = [];
      state.thoughts = [];
      if (Array.isArray(state.characters)) {
        state.characters = state.characters.map(c => ({ ...c, sampleLines: [] }));
      }
      state.draft = {};
      state.page = 'home';
      state.profile = '';
      state.section = 'profile';
      state.extrasTab = 'collection';
      state.migrations[MIGRATION] = { at: new Date().toISOString(), archived: true };

      localStorage.setItem(K, JSON.stringify(state));
      localStorage.removeItem(UI);
    } catch (error) {
      console.warn('Royal Archive migration skipped safely.', error);
    }
  })();
  </script>

  <script type="module" src="js/hv-stable.js?v=80"></script>
</head>
<body>
  <div id="app"></div>
</body>
</html>
