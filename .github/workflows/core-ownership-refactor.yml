name: Core ownership refactor

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/core-ownership-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply refactor
        run: python scripts/core_ownership_refactor.py

      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for f in js/*.js js/dialogue-files/*.js js/ux/*.js; do
            node --check "$f"
          done
          git diff --check

      - name: Validate ownership
        shell: bash
        run: |
          set -euo pipefail
          grep -F "SECS=['profile','dialogue','relationship','extras']" js/hv-stable.js
          ! grep -F 'function editMem(' js/hv-stable.js
          ! grep -F 'data-save-mem' js/hv-stable.js
          grep -F 'id="pDescription"' js/hv-stable.js
          ! grep -F 'function cleanRemoved(' js/hellaverse-cast-dialogues.js
          ! grep -F 'enhanceLegacyCoreEditor' js/editor-ux-suite.js
          ! grep -F 'data-sec="memory"' css/editor-ux-suite.css
          grep -F '.hv-simple-description-section{' css/app.css

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hiyena0502-dotcom'
          git config user.email 'hiyena0502@gmail.com'
          git rm .github/workflows/core-ownership-refactor.yml scripts/core_ownership_refactor.py
          git add js/hv-stable.js js/editor-ux-suite.js js/hellaverse-cast-dialogues.js css/app.css css/editor-ux-suite.css index.html docs/FILE_MAP.md
          git commit -m 'Refactor core ownership and remove duplicate patches'
          git push
