name: Dialogue runtime V13 fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/dialogue-runtime-v13-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fixes
        run: python scripts/fix_dialogue_runtime_v13.py

      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check js/dialogue-runtime-cleanup.js
          node --check js/dialogue-single-beat-runtime.js
          git diff --check

      - name: Validate behavior guards
        shell: bash
        run: |
          set -euo pipefail
          grep -F '__HELLAVERSE_DIALOGUE_RUNTIME_CLEANUP_V13__' js/dialogue-runtime-cleanup.js
          grep -F 'data-hv-runtime-actions-allowed' js/dialogue-runtime-cleanup.js
          grep -F 'hasChoiceOptions(host)' js/dialogue-single-beat-runtime.js
          grep -F 'js/dialogue-runtime-cleanup.js?v=13' index.html
          grep -F 'js/dialogue-single-beat-runtime.js?v=13' index.html

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hiyena0502-dotcom'
          git config user.email 'hiyena0502@gmail.com'
          git rm .github/workflows/dialogue-runtime-v13-fix.yml scripts/fix_dialogue_runtime_v13.py
          git add js/dialogue-runtime-cleanup.js js/dialogue-single-beat-runtime.js index.html docs/FILE_MAP.md
          git commit -m 'Fix dialogue runtime control boundaries and locked choices'
          git push
